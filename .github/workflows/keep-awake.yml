# Supabase pauses free projects after a week without database activity, and
# Railway puts the app to sleep when idle. Every 3 days this wakes the app and
# hits /healthz, which queries the database, so neither stays asleep for long.
# Costs about 1 Actions minute per run (~10 a month of the 2,000 free).
#
# Set the APP_URL repository variable (Settings → Secrets and variables →
# Actions → Variables) to the deployed origin, e.g. https://example.up.railway.app

name: Keep awake

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Set the APP_URL repository variable to the app's URL."
            exit 1
          fi
          # A sleeping Railway app can take a few seconds to start, so retry.
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors \
            --max-time 30 "$APP_URL/healthz"
